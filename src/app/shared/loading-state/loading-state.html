<div role="status" aria-live="polite" [attr.aria-label]="message()">
  @switch (variant()) {
    @case ('list') {
      <div class="space-y-4">
        <div class="flex items-center gap-3">
          <span
            class="inline-block size-5 shrink-0 animate-spin rounded-full border-2 border-gray-200 border-t-blue-600"
            aria-hidden="true"
          ></span>
          <span class="text-sm font-medium text-gray-600">{{ message() }}</span>
        </div>
        <ul class="space-y-3">
          @for (row of [1, 2, 3]; track row) {
            <li
              class="overflow-hidden rounded-md border border-gray-100 bg-white p-4 shadow-sm"
              aria-hidden="true"
            >
              <div class="space-y-3">
                <div class="app-loading-shimmer h-4 max-w-xs rounded-md"></div>
                <div class="app-loading-shimmer h-3 max-w-[200px] rounded-md opacity-80"></div>
                <div class="app-loading-shimmer h-3 max-w-sm rounded-md opacity-70"></div>
              </div>
            </li>
          }
        </ul>
      </div>
    }
    @case ('chips') {
      <div class="space-y-4">
        <div class="flex items-center gap-2">
          <span
            class="inline-block size-4 shrink-0 animate-spin rounded-full border-2 border-gray-200 border-t-blue-600"
            aria-hidden="true"
          ></span>
          <span class="text-xs font-medium text-gray-600">{{ message() }}</span>
        </div>
        <div class="flex flex-wrap gap-2">
          @for (chip of [1, 2, 3, 4, 5]; track chip) {
            <div
              class="app-loading-shimmer h-10 w-[132px] rounded-full"
              aria-hidden="true"
            ></div>
          }
        </div>
      </div>
    }
    @default {
      <div class="flex items-center gap-2">
        <span
          class="inline-block size-4 shrink-0 animate-spin rounded-full border-2 border-gray-200 border-t-blue-600"
          aria-hidden="true"
        ></span>
        <span class="text-xs text-gray-500">{{ message() }}</span>
      </div>
    }
  }
</div>
