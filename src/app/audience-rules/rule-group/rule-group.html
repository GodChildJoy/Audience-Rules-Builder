<div class="space-y-4" [class]="nested() ? 'rounded-lg border border-purple-200 bg-white p-4' : ''">
  <app-logic-toggle [groupId]="group().id" [logic]="group().logic" />

  <div class="space-y-3">
    @for (c of group().conditions; track c.id) {
      <app-rule-condition-row [groupId]="group().id" [condition]="c" />
    }
  </div>

  <div class="space-y-3">
    @for (sub of group().groups; track sub.id) {
      <app-rule-group [groupId]="sub.id" [nested]="true" />
    }
  </div>

  @if (nested()) {
    <div class="flex flex-wrap gap-3">
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-md border border-dashed border-gray-300 bg-gray-50 px-4 py-2.5 text-sm font-medium text-gray-600 transition-colors hover:border-gray-400 hover:bg-gray-100"
        (click)="addNestedCondition()"
      >
        <span class="text-base leading-none">+</span>
        Add condition
      </button>
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-md border border-dashed border-gray-300 bg-gray-50 px-4 py-2.5 text-sm font-medium text-gray-600 transition-colors hover:border-gray-400 hover:bg-gray-100"
        (click)="addNestedGroup()"
      >
        <span class="text-base leading-none">+</span>
        Add group
      </button>
    </div>
  }
</div>
