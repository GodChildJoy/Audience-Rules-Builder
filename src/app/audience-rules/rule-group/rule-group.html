<div class="space-y-4" [class]="nested() ? 'rounded-lg border border-purple-200 bg-white p-4' : ''">
  <app-logic-toggle [groupId]="group().id" [logic]="group().logic" />

  <div class="space-y-3">
    @for (c of group().conditions; track c.id) {
      <app-rule-condition-row [groupId]="group().id" [condition]="c" />
    }
  </div>

  <div class="space-y-3">
    @for (sub of group().groups; track sub.id) {
      <app-rule-group [groupId]="sub.id" [nested]="true" />
    }
  </div>

  @if (nested()) {
    <button
      type="button"
      class="flex w-full items-center justify-center gap-2 rounded-md border border-dashed border-gray-300 bg-gray-50 px-3 py-2.5 text-sm font-medium text-gray-500 transition-colors hover:border-gray-400 hover:bg-gray-100 hover:text-gray-700"
      (click)="addNestedCondition()"
    >
      <span class="text-base leading-none">+</span>
      Add condition
    </button>
  }
</div>
