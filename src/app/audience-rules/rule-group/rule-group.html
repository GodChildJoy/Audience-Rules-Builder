<div class="space-y-4" [class.arb-nested-group]="nested()">
  <app-logic-toggle [groupId]="group().id" [logic]="group().logic" />

  <div class="space-y-3">
    @for (c of group().conditions; track c.id) {
      <app-rule-condition-row [groupId]="group().id" [condition]="c" />
    }
  </div>

  <div class="space-y-3">
    @for (sub of group().groups; track sub.id) {
      <app-rule-group [groupId]="sub.id" [nested]="true" />
    }
  </div>

  @if (nested()) {
    <div class="flex flex-wrap gap-3">
      <button type="button" class="arb-btn-dashed" (click)="addNestedCondition()">
        <span class="arb-btn-icon-plus">+</span>
        Add condition
      </button>
      <button type="button" class="arb-btn-dashed" (click)="addNestedGroup()">
        <span class="arb-btn-icon-plus">+</span>
        Add group
      </button>
    </div>
  }
</div>
