<div class="space-y-3" [class.arb-nested-group]="nested()">
  <div class="arb-logic-toolbar">
    <div
      class="arb-logic-shell"
      role="group"
      [attr.aria-label]="'Combine conditions with ' + group().logic"
    >
      <span
        class="arb-logic-btn"
        [class.text-blue-600]="group().logic === 'AND'"
        [class.bg-white]="group().logic === 'AND'"
        [class.shadow-sm]="group().logic === 'AND'"
        [class.text-gray-500]="group().logic !== 'AND'"
      >
        AND
      </span>
      <span
        class="arb-logic-btn"
        [class.text-blue-600]="group().logic === 'OR'"
        [class.bg-white]="group().logic === 'OR'"
        [class.shadow-sm]="group().logic === 'OR'"
        [class.text-gray-500]="group().logic !== 'OR'"
      >
        OR
      </span>
    </div>
    <span class="arb-kicker">
      {{ helper[group().logic] }}
    </span>
  </div>

  @if (group().conditions.length > 0) {
    <div class="arb-rule-table-wrap">
      <table class="arb-rule-table">
        <thead class="arb-rule-thead">
          <tr>
            <th class="arb-rule-th">Field</th>
            <th class="arb-rule-th">Operator</th>
            <th class="arb-rule-th">Value</th>
          </tr>
        </thead>
        <tbody class="arb-rule-tbody">
          @for (c of group().conditions; track $index) {
            <tr class="arb-rule-tr">
              <td class="arb-rule-td-emphasis">{{ c.field }}</td>
              <td class="arb-rule-td-muted">{{ c.operator }}</td>
              <td class="arb-rule-td">{{ c.value }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }

  @if (group().groups.length > 0) {
    <div class="arb-rule-nested-stack">
      @for (sub of group().groups; track $index) {
        <app-rule-payload-view [group]="sub" [nested]="true" />
      }
    </div>
  }
</div>
