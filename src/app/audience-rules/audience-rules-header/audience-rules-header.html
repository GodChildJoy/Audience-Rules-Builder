<header class="arb-panel-header">
  <div>
    <h1 class="arb-title-page">Audience Rules</h1>
    @if (hasValidationErrors()) {
      <p class="mt-1 text-xs font-medium text-red-600">Fix validation errors before saving.</p>
    }
  </div>
  <button
    type="button"
    class="arb-btn-primary"
    (click)="onSave()"
    [disabled]="saveInProgress()"
  >
    @if (saveInProgress()) {
      <span class="arb-spinner-white" aria-hidden="true"></span>
      <span>Saving…</span>
    } @else {
      <span>Save Rule</span>
    }
  </button>
</header>
