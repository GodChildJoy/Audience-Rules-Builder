<div class="arb-page">
  <div class="arb-page-inner">
    <div class="arb-card">
      <app-audience-rules-header />

      <div class="arb-section-muted">
        <app-rule-group [groupId]="root().id" />
      </div>

      <div class="arb-card-footer-actions">
        <button type="button" class="arb-btn-dashed" (click)="addRootCondition()">
          <span class="arb-btn-icon-plus">+</span>
          Add condition
        </button>
        <button type="button" class="arb-btn-dashed" (click)="addRootGroup()">
          <span class="arb-btn-icon-plus">+</span>
          Add group
        </button>
      </div>

      <div class="arb-section-muted-continued">
        <app-matching-contacts />
      </div>
    </div>

    <app-audience-rules-list />
  </div>
</div>
