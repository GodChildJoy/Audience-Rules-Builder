<div class="flex flex-wrap items-center gap-3 text-sm">
  <div class="arb-logic-shell" role="group" aria-label="Combine conditions with">
    <button
      type="button"
      class="arb-logic-btn"
      [class.text-blue-600]="logic() === 'AND'"
      [class.bg-white]="logic() === 'AND'"
      [class.shadow-sm]="logic() === 'AND'"
      [class.text-gray-500]="logic() !== 'AND'"
      (click)="setLogic('AND')"
    >
      AND
    </button>
    <button
      type="button"
      class="arb-logic-btn"
      [class.text-blue-600]="logic() === 'OR'"
      [class.bg-white]="logic() === 'OR'"
      [class.shadow-sm]="logic() === 'OR'"
      [class.text-gray-500]="logic() !== 'OR'"
      (click)="setLogic('OR')"
    >
      OR
    </button>
  </div>
  <span class="text-xs font-medium uppercase tracking-wide text-gray-500">
    {{ helper[logic()] }}
  </span>
</div>
