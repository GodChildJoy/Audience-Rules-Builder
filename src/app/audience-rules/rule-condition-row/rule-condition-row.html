<div class="py-1">
  <div class="flex flex-wrap items-center gap-2 md:flex-nowrap">
  <div class="min-w-arb-field flex-1">
    <label class="sr-only" [for]="'field-' + condition().id">Field</label>
    <select
      class="arb-field-control"
      [class.arb-field-control--valid]="!showValidation() || !conditionErrors().field"
      [class.arb-field-control--invalid]="showValidation() && !!conditionErrors().field"
      [id]="'field-' + condition().id"
      [value]="condition().field"
      (change)="onFieldChange($any($event.target).value)"
      [attr.aria-invalid]="showValidation() && !!conditionErrors().field"
    >
      @for (f of fields; track f.id) {
        <option [value]="f.id" [disabled]="isFieldDisabled(f.id)">{{ f.label }}</option>
      }
    </select>
  </div>
  <div class="min-w-arb-field flex-1">
    <label class="sr-only" [for]="'op-' + condition().id">Operator</label>
    <select
      class="arb-field-control"
      [class.arb-field-control--valid]="!showValidation() || !conditionErrors().operator"
      [class.arb-field-control--invalid]="showValidation() && !!conditionErrors().operator"
      [id]="'op-' + condition().id"
      [value]="condition().operator"
      (change)="onOperatorChange($any($event.target).value)"
      [attr.aria-invalid]="showValidation() && !!conditionErrors().operator"
    >
      @for (o of operatorsForField(); track o.id) {
        <option [value]="o.id">{{ o.label }}</option>
      }
    </select>
  </div>
  <div class="min-w-arb-value flex-[1.2]">
    <label class="sr-only" [for]="'val-' + condition().id">Value</label>
    @if (isDateField()) {
      <input
        class="arb-field-control"
        [class.arb-field-control--valid]="!showValidation() || !conditionErrors().value"
        [class.arb-field-control--invalid]="showValidation() && !!conditionErrors().value"
        [id]="'val-' + condition().id"
        type="date"
        [value]="condition().value"
        (input)="patch({ value: $any($event.target).value })"
        [attr.aria-invalid]="showValidation() && !!conditionErrors().value"
      />
    } @else {
      <input
        class="arb-field-control"
        [class.arb-field-control--valid]="!showValidation() || !conditionErrors().value"
        [class.arb-field-control--invalid]="showValidation() && !!conditionErrors().value"
        [id]="'val-' + condition().id"
        type="text"
        placeholder="Value"
        [value]="condition().value"
        (input)="patch({ value: $any($event.target).value })"
        [attr.aria-invalid]="showValidation() && !!conditionErrors().value"
      />
    }
  </div>
  <button
    type="button"
    class="arb-btn-remove"
    (click)="remove()"
    aria-label="Remove condition"
  >
    <span class="text-lg leading-none" aria-hidden="true">×</span>
  </button>
  </div>
  @if (showValidation() && firstValidationError()) {
    <p class="arb-alert-error">{{ firstValidationError() }}</p>
  }
</div>
